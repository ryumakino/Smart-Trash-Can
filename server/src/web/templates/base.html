<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>TrashNet Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema de classificação de resíduos TrashNet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-spinner">
      <i class="fas fa-recycle fa-spin"></i>
      <p>Carregando...</p>
    </div>
  </div>

  <!-- Notification System -->
  <div id="notification-container" class="notification-container"></div>

  <nav class="navbar">
    <div class="nav-brand">
      <i class="fas fa-recycle brand-icon"></i>
      <h1>TrashNet</h1>
      <span class="status-indicator online" id="status-indicator" title="Sistema Online"></span>
    </div>
    <ul class="nav-menu">
      <li><a href="{{ url_for('views.index') }}" class="nav-link"><i class="fas fa-chart-dashboard"></i>Dashboard</a></li>
      <li><a href="{{ url_for('views.devices') }}" class="nav-link"><i class="fas fa-microchip"></i>Dispositivos</a></li>
      <li><a href="{{ url_for('views.classes') }}" class="nav-link"><i class="fas fa-tags"></i>Classes</a></li>
      <li><a href="{{ url_for('views.logs') }}" class="nav-link"><i class="fas fa-file-alt"></i>Logs</a></li>
      <li><a href="{{ url_for('views.settings') }}" class="nav-link"><i class="fas fa-cogs"></i>Configurações</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn-icon" onclick="toggleTheme()" title="Alternar Tema">
        <i class="fas fa-palette"></i>
      </button>
      <span class="current-time" id="current-time"></span>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-content">
      <span>TrashNet © 2025</span>
      <span class="version">v2.1.0</span>
      <span id="system-status">Sistema Operacional</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
</body>
</html>
